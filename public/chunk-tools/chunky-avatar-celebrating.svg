<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 60 60">
  <defs><style>
    .hc{animation:hcel 1.1s ease-in-out infinite;transform-origin:30px 55px;transform-box:fill-box;}
    .cf{animation:cfall 1.5s ease-in infinite;}
    @keyframes hcel{0%,100%{transform:rotate(0deg) translateY(0)}20%{transform:rotate(-5deg) translateY(-4px)}45%{transform:rotate(5deg) translateY(-6px)}70%{transform:rotate(-2.5deg) translateY(-2px)}85%{transform:rotate(2deg) translateY(-1px)}}
    @keyframes cfall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(22px) rotate(180deg);opacity:0}}
  </style></defs>
  <rect class="cf" x="9" y="4"  width="7" height="7" rx="2" fill="#F5CF0D" style="animation-delay:0s;transform-origin:12px 7px;transform-box:fill-box;"/>
  <rect class="cf" x="44" y="6" width="6" height="6" rx="1.5" fill="#9736E8" style="animation-delay:.5s;transform-origin:47px 9px;transform-box:fill-box;"/>
  <circle class="cf" cx="50" cy="20" r="3.5" fill="#EF9F27" style="animation-delay:.25s;transform-origin:50px 20px;transform-box:fill-box;"/>
  <g class="hc">
    <line x1="30" y1="13" x2="30" y2="5" stroke="#271FE0" stroke-width="3" stroke-linecap="round"/>
    <rect x="24" y="1" width="12" height="10" rx="3" fill="#F5CF0D"/>
    <rect x="26" y="3" width="5" height="4" rx="1.2" fill="white" opacity="0.55"/>
    <circle cx="38" cy="1" r="3" fill="#9736E8" opacity="0.8"/>
    <rect x="14" y="13" width="32" height="36" rx="12" fill="#4945FF"/>
    <circle cx="23" cy="26" r="9"  fill="white"/>
    <circle cx="25" cy="28" r="6"  fill="#32324D"/>
    <circle cx="20" cy="21" r="4"  fill="white"/>
    <circle cx="37" cy="26" r="9"  fill="white"/>
    <circle cx="35" cy="28" r="6"  fill="#32324D"/>
    <circle cx="32" cy="21" r="4"  fill="white"/>
    <ellipse cx="16" cy="36" rx="7" ry="4" fill="#FF9EC4" opacity="0.75"/>
    <ellipse cx="44" cy="36" rx="7" ry="4" fill="#FF9EC4" opacity="0.75"/>
    <path d="M 20 41 Q 30 51 40 41" stroke="white" stroke-width="3.2" stroke-linecap="round" fill="none"/>
  </g>
</svg>
