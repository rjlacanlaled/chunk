    <rect x="8" y="36" width="14" height="8" rx="4" fill="#4945FF" opacity=".5"/>
    <circle cx="42" cy="16" r="10" fill="#5CB176" opacity=".7"/>
    <rect x="37" y="15" width="10" height="2.5" rx="1.25" fill="white"/>
