<svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 56 56">
  <defs><style>
    .idle{animation:breathe 2.8s ease-in-out infinite;}
    @keyframes breathe{0%,100%{opacity:.65}50%{opacity:1}}
  </style></defs>
  <rect width="56" height="56" rx="14" fill="#0D0D2E"/>
  <g class="idle">
    <circle cx="22" cy="22" r="13" fill="none" stroke="#4945FF" stroke-width="2.5" opacity=".8"/>
    <circle cx="22" cy="22" r="7" fill="#4945FF" opacity=".08"/>
    <line x1="22" y1="13" x2="22" y2="22" stroke="#4945FF" stroke-width="1.8" stroke-linecap="round" opacity=".5"/>
    <line x1="32" y1="32" x2="47" y2="47" stroke="#4945FF" stroke-width="3" stroke-linecap="round" opacity=".8"/>
  </g>
</svg>
