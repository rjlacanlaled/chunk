<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 60 60">
  <defs><style>
    .hb{animation:hbob 3s ease-in-out infinite;transform-origin:30px 55px;transform-box:fill-box;}
    .ac{animation:acub 2s ease-in-out infinite;transform-origin:30px 5px;transform-box:fill-box;}
    .bl{animation:blink 4s ease-in-out infinite;transform-box:fill-box;}
    .bl2{animation:blink 4s ease-in-out infinite .15s;transform-box:fill-box;}
    .bs{animation:blsh 3s ease-in-out infinite;}
    @keyframes hbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
    @keyframes acub{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
    @keyframes blink{0%,90%,100%{transform:scaleY(1)}93%,97%{transform:scaleY(.07)}}
    @keyframes blsh{0%,100%{opacity:.45}50%{opacity:.75}}
  </style></defs>
  <g class="hb">
    <line x1="30" y1="13" x2="30" y2="5" stroke="#271FE0" stroke-width="3" stroke-linecap="round"/>
    <g class="ac"><rect x="24" y="1" width="12" height="10" rx="3" fill="#F5CF0D"/><rect x="26" y="3" width="5" height="4" rx="1.2" fill="white" opacity="0.5"/></g>
    <rect x="14" y="13" width="32" height="36" rx="12" fill="#4945FF"/>
    <circle class="bl"  cx="23" cy="27" r="8" fill="white" style="transform-origin:23px 27px;"/>
    <circle cx="25" cy="29" r="5" fill="#32324D"/>
    <circle cx="20" cy="23" r="3" fill="white"/>
    <circle class="bl2" cx="37" cy="27" r="8" fill="white" style="transform-origin:37px 27px;"/>
    <circle cx="35" cy="29" r="5" fill="#32324D"/>
    <circle cx="33" cy="23" r="3" fill="white"/>
    <ellipse class="bs" cx="16" cy="36" rx="7" ry="4" fill="#FF9EC4"/>
    <ellipse class="bs" cx="44" cy="36" rx="7" ry="4" fill="#FF9EC4"/>
    <path d="M 22 40 Q 30 47 38 40" stroke="white" stroke-width="2.8" stroke-linecap="round" fill="none"/>
  </g>
</svg>
