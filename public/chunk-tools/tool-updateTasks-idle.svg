<svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 56 56">
  <defs><style>
    .idle{animation:breathe 2.8s ease-in-out infinite;}
    @keyframes breathe{0%,100%{opacity:.65}50%{opacity:1}}
  </style></defs>
  <rect width="56" height="56" rx="14" fill="#1A1000"/>
  <g class="idle">
    <rect x="8" y="11" width="30" height="8" rx="4" fill="#EF9F27" opacity=".9"/>
    <rect x="8" y="22" width="22" height="8" rx="4" fill="#EF9F27" opacity=".7"/>
    <rect x="8" y="33" width="15" height="8" rx="4" fill="#EF9F27" opacity=".5"/>
  </g>
</svg>
