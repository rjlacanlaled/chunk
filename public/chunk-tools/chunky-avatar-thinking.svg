<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 60 60">
  <defs><style>
    .ht{animation:hthink 2.6s ease-in-out infinite;transform-origin:30px 55px;transform-box:fill-box;}
    .el{animation:eyelook 2.6s ease-in-out infinite;transform-box:fill-box;}
    .brw{animation:browrise 2.6s ease-in-out infinite;transform-origin:40px 17px;transform-box:fill-box;}
    .tb{animation:tbbub 2s ease-in-out infinite;}
    @keyframes hthink{0%,100%{transform:rotate(0deg)}30%{transform:rotate(-3.5deg)}70%{transform:rotate(2.5deg)}}
    @keyframes eyelook{0%,100%{transform:translateX(0)}40%{transform:translateX(2px)}70%{transform:translateX(-1px)}}
    @keyframes browrise{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
    @keyframes tbbub{0%,100%{opacity:.4;transform:scale(.9)}50%{opacity:1;transform:scale(1)}}
  </style></defs>
  <g class="ht">
    <line x1="30" y1="13" x2="30" y2="5" stroke="#271FE0" stroke-width="3" stroke-linecap="round"/>
    <rect x="24" y="1" width="12" height="10" rx="3" fill="#F5CF0D" opacity="0.88"/>
    <rect x="14" y="13" width="32" height="36" rx="12" fill="#4945FF"/>
    <circle cx="23" cy="27" r="8" fill="white"/>
    <circle cx="25" cy="29" r="5" fill="#32324D" class="el" style="transform-origin:25px 29px;"/>
    <circle cx="20" cy="23" r="3" fill="white"/>
    <ellipse cx="37" cy="25" rx="7" ry="5.5" fill="white"/>
    <circle cx="36" cy="27" r="4" fill="#32324D" class="el" style="transform-origin:36px 27px;"/>
    <circle cx="33" cy="22" r="2.5" fill="white"/>
    <path class="brw" d="M 33 18 Q 39 14 45 18" stroke="white" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 22 41 Q 30 45 38 41" stroke="white" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <circle class="tb" cx="48" cy="10" r="8" fill="white" opacity="0.1" stroke="white" stroke-width="1.2" stroke-dasharray="2 3"/>
    <text x="48" y="13.5" text-anchor="middle" font-family="system-ui" font-size="8" fill="white" opacity="0.5" class="tb">...</text>
  </g>
</svg>
