<svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 56 56">
  <defs><style>
    .ck-ring{animation:ck-ring 2s ease-in-out infinite;stroke-dasharray:88;}
    .ck-draw{animation:ck-draw 2s ease-in-out infinite;stroke-dasharray:28;}
    .ck-shine{animation:ck-shine 2s ease-in-out infinite;transform-origin:28px 28px;transform-box:fill-box;}
    @keyframes ck-ring{0%,20%{stroke-dashoffset:88;opacity:.3}70%,100%{stroke-dashoffset:0;opacity:1}}
    @keyframes ck-draw{0%,20%{stroke-dashoffset:28}70%,100%{stroke-dashoffset:0}}
    @keyframes ck-shine{0%,80%,100%{opacity:0;transform:scale(.6)}88%{opacity:.9;transform:scale(1.35)}}
  </style></defs>
  <rect width="56" height="56" rx="14" fill="#0D2010"/>
  <circle class="ck-ring" cx="28" cy="28" r="14" fill="none" stroke="#5CB176" stroke-width="2.5" transform="rotate(-90 28 28)" stroke-linecap="round"/>
  <g class="ck-shine"><circle cx="28" cy="28" r="10" fill="#5CB176" opacity="0.15"/></g>
  <path class="ck-draw" d="M18 28 l8 8 l14 -16" fill="none" stroke="#5CB176" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
