<svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 56 56">
  <defs><style>
    .del-body{animation:del-shake 2s ease-in-out infinite;transform-origin:28px 36px;transform-box:fill-box;}
    .del-lid{animation:del-lid 2s ease-in-out infinite;transform-origin:28px 22px;transform-box:fill-box;}
    .del-b1{animation:del-bar 2s ease-in-out infinite 0s;transform-origin:center top;transform-box:fill-box;}
    .del-b2{animation:del-bar 2s ease-in-out infinite .12s;transform-origin:center top;transform-box:fill-box;}
    .del-b3{animation:del-bar 2s ease-in-out infinite .24s;transform-origin:center top;transform-box:fill-box;}
    @keyframes del-shake{0%,100%{transform:rotate(0deg)}20%{transform:rotate(-8deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(5deg)}}
    @keyframes del-lid{0%,40%,100%{transform:rotate(0deg)}20%{transform:rotate(-22deg)}}
    @keyframes del-bar{0%,60%,100%{opacity:1;transform:scaleY(1)}75%{opacity:0;transform:scaleY(0)}}
  </style></defs>
  <rect width="56" height="56" rx="14" fill="#1F0808"/>
  <g class="del-body">
    <rect x="11" y="22" width="34" height="28" rx="5" fill="none" stroke="#E24B4A" stroke-width="2.2"/>
    <g class="del-b1"><rect x="18" y="27" width="4" height="16" rx="2" fill="#E24B4A"/></g>
    <g class="del-b2"><rect x="26" y="27" width="4" height="16" rx="2" fill="#E24B4A"/></g>
    <g class="del-b3"><rect x="34" y="27" width="4" height="16" rx="2" fill="#E24B4A"/></g>
  </g>
  <g class="del-lid">
    <rect x="8"  y="15" width="40" height="7"  rx="3.5" fill="#E24B4A"/>
    <rect x="18" y="8"  width="20" height="7"  rx="3.5" fill="#E24B4A" opacity="0.7"/>
  </g>
</svg>
