<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 60 60" style="overflow:visible;">
  <defs><style>
    .tb{animation:t-sway 3s ease-in-out infinite;transform-origin:50% 70%;transform-box:fill-box;}
    .tp{animation:t-pupil 3s ease-in-out infinite;transform-origin:50% 50%;transform-box:fill-box;}
    .tbr{animation:t-brow 3s ease-in-out infinite;transform-origin:50% 50%;transform-box:fill-box;}
    .td1{animation:t-dot 2.2s ease-in-out infinite 0s;transform-origin:50% 50%;transform-box:fill-box;}
    .td2{animation:t-dot 2.2s ease-in-out infinite .4s;transform-origin:50% 50%;transform-box:fill-box;}
    .td3{animation:t-dot 2.2s ease-in-out infinite .8s;transform-origin:50% 50%;transform-box:fill-box;}
    @keyframes t-sway{0%,100%{transform:rotate(0deg) translateY(0)}30%{transform:rotate(-4deg) translateY(-2px)}70%{transform:rotate(3deg) translateY(-1px)}}
    @keyframes t-pupil{0%,100%{transform:translate(0,0)}40%,80%{transform:translate(-3px,-3px)}}
    @keyframes t-brow{0%,100%{transform:translateY(0)}40%,80%{transform:translateY(-4px)}}
    @keyframes t-dot{0%,60%{opacity:0;transform:scale(.5)}75%,90%{opacity:1;transform:scale(1)}100%{opacity:0}}
  </style></defs>
  <g class="tb">
    <line x1="30" y1="12" x2="30" y2="4" stroke="#271FE0" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="23" y="0" width="14" height="10" rx="3" fill="#F5CF0D"/>
    <rect x="24.5" y="1.5" width="6" height="4" rx="1.2" fill="white" opacity=".45"/>
    <rect x="10" y="12" width="40" height="38" rx="14" fill="#4945FF"/>
    <circle cx="22" cy="27" r="9" fill="white"/>
    <g class="tp"><circle cx="20" cy="25" r="5.5" fill="#32324D"/><circle cx="17.5" cy="22" r="3" fill="white"/></g>
    <ellipse cx="38" cy="27" rx="9" ry="7" fill="white"/>
    <g class="tp" style="animation-delay:.05s;"><circle cx="36" cy="25" r="4.5" fill="#32324D"/><circle cx="33.5" cy="22.5" r="2.5" fill="white"/></g>
    <g class="tbr"><path d="M31 17 Q38 14 45 17" stroke="white" stroke-width="2.2" stroke-linecap="round" fill="none" opacity=".7"/></g>
    <path d="M24 42 Q30 43 36 42" stroke="white" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <ellipse cx="13" cy="37" rx="6" ry="3.5" fill="#FF9EC4" opacity=".35"/>
    <ellipse cx="47" cy="37" rx="6" ry="3.5" fill="#FF9EC4" opacity=".35"/>
  </g>
  <g class="td1"><circle cx="52" cy="8" r="3.5" fill="white" opacity=".5"/></g>
  <g class="td2"><circle cx="58" cy="4" r="2.5" fill="white" opacity=".4"/></g>
  <g class="td3"><circle cx="62" cy="0" r="1.8" fill="white" opacity=".3"/></g>
</svg>
