<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chunk — Avatar States</title>
<style>
  body { background:#060D1F; padding:48px; font-family:system-ui,sans-serif; display:flex; flex-direction:column; gap:32px; }
  .row { display:flex; gap:24px; align-items:flex-end; }
  .item { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .label { font-size:11px; font-weight:700; color:rgba(255,255,255,.35); font-family:monospace; }
  .sub   { font-size:9px; color:rgba(255,255,255,.2); font-family:monospace; }
  h2 { font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:rgba(255,255,255,.25); }
  .chat { display:flex; flex-direction:column; gap:8px; max-width:380px; }
  .bubble { display:flex; gap:9px; align-items:flex-start; }
  .msg { background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.08); border-radius:4px 14px 14px 14px; padding:10px 14px; font-size:13px; color:rgba(255,255,255,.6); }
  .chip { display:inline-flex; align-items:center; gap:6px; background:rgba(73,69,255,.12); border:1px solid rgba(73,69,255,.25); border-radius:100px; padding:3px 9px 3px 7px; font-size:11px; font-weight:600; color:#8B89FF; }
</style>
</head>
<body>
  <h2>40px avatars</h2>
  <div class="row">
    <div class="item"><object data="avatar-idle-40.svg" width="40" height="40"></object><span class="label">idle</span><span class="sub">floats · blinks</span></div>
    <div class="item"><object data="avatar-thinking-40.svg" width="40" height="40" style="overflow:visible;"></object><span class="label">thinking</span><span class="sub">eyes up · sway · dots</span></div>
    <div class="item"><object data="avatar-working-40.svg" width="40" height="40" style="overflow:visible;"></object><span class="label">working</span><span class="sub">squint · spin · sparks</span></div>
  </div>
  <h2>32px avatars</h2>
  <div class="row">
    <div class="item"><object data="avatar-idle-32.svg" width="32" height="32"></object><span class="label">idle</span></div>
    <div class="item"><object data="avatar-thinking-32.svg" width="32" height="32" style="overflow:visible;"></object><span class="label">thinking</span></div>
    <div class="item"><object data="avatar-working-32.svg" width="32" height="32" style="overflow:visible;"></object><span class="label">working</span></div>
  </div>
  <h2>In chat</h2>
  <div class="chat">
    <div class="bubble">
      <object data="avatar-thinking-40.svg" width="36" height="36" style="flex-shrink:0;border-radius:9px;overflow:visible;"></object>
      <div class="msg" style="color:rgba(255,255,255,.35);font-style:italic;">Thinking...</div>
    </div>
    <div class="bubble">
      <object data="avatar-working-40.svg" width="36" height="36" style="flex-shrink:0;border-radius:9px;overflow:visible;"></object>
      <div class="msg"><span class="chip">Creating tasks...</span></div>
    </div>
    <div class="bubble">
      <object data="avatar-idle-40.svg" width="36" height="36" style="flex-shrink:0;border-radius:9px;overflow:visible;"></object>
      <div class="msg">Done! I've broken that into 4 tasks sorted by urgency. 🎯</div>
    </div>
  </div>
</body>
</html>
