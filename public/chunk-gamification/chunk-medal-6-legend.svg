<svg xmlns="http://www.w3.org/2000/svg" width="128" height="148" viewBox="0 0 128 148">
  <defs>
    <linearGradient id="legend-stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#4945FF"/>
      <stop offset="40%"  stop-color="#9736E8"/>
      <stop offset="70%"  stop-color="#F5CF0D"/>
      <stop offset="100%" stop-color="#4945FF"/>
    </linearGradient>
    <style>
      .lr { animation: lspin 8s linear infinite; transform-origin: 64px 64px; transform-box: fill-box; }
      .lc { animation: lbob 1.8s ease-in-out infinite; transform-origin: 64px 32px; transform-box: fill-box; }
      @keyframes lspin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
      @keyframes lbob  { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-2px)} }
    </style>
  </defs>
