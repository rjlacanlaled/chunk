<svg xmlns="http://www.w3.org/2000/svg" width="200" height="280" viewBox="0 0 300 420">
  <defs>
    <style>
      .cb { animation: cfloat 3s ease-in-out infinite; transform-origin: 150px 400px; transform-box: fill-box; }
      .ac { animation: cubob 2.1s ease-in-out infinite; transform-origin: 150px 44px; transform-box: fill-box; }
      .bl { animation: blink 4s ease-in-out infinite; transform-box: fill-box; }
      .bl2 { animation: blink 4s ease-in-out infinite .15s; transform-box: fill-box; }
      .bs { animation: blush 3.2s ease-in-out infinite; }
      .ss { animation: starspin 4s linear infinite; transform-origin: 30px 60px; transform-box: fill-box; }
      @keyframes cfloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
      @keyframes cubob  { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
      @keyframes blink  { 0%,94%,100%{transform:scaleY(1)} 96%,98%{transform:scaleY(0.05)} }
      @keyframes blush  { 0%,100%{opacity:.5} 50%{opacity:.82} }
      @keyframes starspin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
    </style>
  </defs>
  <g class="cb">
    <line x1="150" y1="92" x2="150" y2="50" stroke="#271FE0" stroke-width="6" stroke-linecap="round"/>
    <g class="ac">
      <rect x="134" y="28" width="32" height="26" rx="7" fill="#F5CF0D"/>
      <rect x="137" y="31" width="13" height="9" rx="2.5" fill="white" opacity="0.5"/>
      <circle cx="168" cy="27" r="5" fill="#9736E8" opacity="0.8"/>
    </g>
    <rect x="75" y="90" width="150" height="148" rx="46" fill="#4945FF"/>
    <circle class="bl" cx="118" cy="162" r="28" fill="white" style="transform-origin:118px 162px;"/>
    <circle cx="122" cy="167" r="15" fill="#32324D"/>
    <circle cx="112" cy="153" r="9" fill="white"/>
    <circle class="bl2" cx="182" cy="162" r="28" fill="white" style="transform-origin:182px 162px;"/>
    <circle cx="178" cy="167" r="15" fill="#32324D"/>
    <circle cx="172" cy="153" r="9" fill="white"/>
    <ellipse class="bs" cx="82" cy="197" rx="24" ry="13" fill="#FF9EC4"/>
    <ellipse class="bs" cx="218" cy="197" rx="24" ry="13" fill="#FF9EC4"/>
    <path d="M 120 210 Q 150 232 180 210" stroke="white" stroke-width="5.5" stroke-linecap="round" fill="none"/>
    <rect x="28" y="232" width="50" height="86" rx="20" fill="#3B37E0"/>
    <rect x="222" y="232" width="50" height="86" rx="20" fill="#3B37E0"/>
    <circle cx="53" cy="318" r="15" fill="#3B37E0"/>
    <circle cx="247" cy="318" r="15" fill="#3B37E0"/>
    <rect x="62" y="234" width="176" height="138" rx="32" fill="#4945FF"/>
    <rect x="88" y="258" width="124" height="17" rx="5" fill="white" opacity="0.92"/>
    <rect x="88" y="279" width="91" height="17" rx="5" fill="white" opacity="0.92"/>
    <rect x="88" y="300" width="58" height="17" rx="5" fill="white" opacity="0.92"/>
    <rect x="92" y="366" width="46" height="54" rx="18" fill="#3B37E0"/>
    <rect x="162" y="366" width="46" height="54" rx="18" fill="#3B37E0"/>
    <ellipse cx="115" cy="420" rx="36" ry="12" fill="#32324D"/>
    <ellipse cx="185" cy="420" rx="36" ry="12" fill="#32324D"/>
    <g class="ss">
      <polygon points="30,52 32,58 38,58 33,62 35,68 30,64 25,68 27,62 22,58 28,58" fill="#F5CF0D" opacity="0.85"/>
    </g>
    <circle cx="245" cy="78" r="6" fill="#F5CF0D" opacity="0.6"/>
    <circle cx="256" cy="96" r="4" fill="#9736E8" opacity="0.5"/>
    <circle cx="38" cy="108" r="4" fill="#5CB176" opacity="0.5"/>
  </g>
</svg>
