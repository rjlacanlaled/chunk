<svg xmlns="http://www.w3.org/2000/svg" width="200" height="290" viewBox="0 0 300 430">
  <defs>
    <style>
      .cc { animation: celebrate 1.2s ease-in-out infinite; transform-origin: 150px 420px; transform-box: fill-box; }
      .ac { animation: cubob 1.6s ease-in-out infinite; transform-origin: 150px 44px; transform-box: fill-box; }
      .cf { animation: conffall 1.6s ease-in infinite; }
      @keyframes celebrate { 0%,100%{transform:rotate(0deg) translateY(0)} 20%{transform:rotate(-4deg) translateY(-4px)} 40%{transform:rotate(4deg) translateY(-7px)} 60%{transform:rotate(-2deg) translateY(-3px)} 80%{transform:rotate(2deg) translateY(-1px)} }
      @keyframes cubob    { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
      @keyframes conffall { 0%{transform:translateY(0) rotate(0deg);opacity:1} 100%{transform:translateY(28px) rotate(360deg);opacity:0} }
    </style>
  </defs>
  <g class="cc">
