<svg width="200" height="200" viewBox="-100 -100 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="ck-anim">
      <path d="M 0,-80 C 28,-31 28,-31 80,0 C 28,31 28,31 0,80 C -28,31 -28,31 -80,0 C -28,-31 -28,-31 0,-80 Z"/>
    </clipPath>
    <style>
      .sparkle-body {
        animation: sparkle-spin 3.6s cubic-bezier(0.4,0,0.6,1) infinite;
        transform-origin: 0px 0px;
      }
      .bar1 {
        animation: bar-in 2.4s ease-in-out infinite;
        transform-origin: -33px -16px;
        animation-delay: 0s;
      }
      .bar2 {
        animation: bar-in 2.4s ease-in-out infinite;
        transform-origin: -24px 7px;
        animation-delay: 0.18s;
      }
      .bar3 {
        animation: bar-in 2.4s ease-in-out infinite;
        transform-origin: -16px 30px;
        animation-delay: 0.36s;
      }
      .cube {
        animation: cube-blink 2.4s ease-in-out infinite;
        transform-origin: 79px -83px;
      }
      .dot {
        animation: dot-breathe 2.4s ease-in-out infinite;
        transform-origin: -72px 66px;
        animation-delay: 0.4s;
      }
      @keyframes sparkle-spin {
        0%   { transform: rotate(0deg) scale(1); }
        25%  { transform: rotate(90deg) scale(1.04); }
        50%  { transform: rotate(180deg) scale(1); }
        75%  { transform: rotate(270deg) scale(1.04); }
        100% { transform: rotate(360deg) scale(1); }
      }
      @keyframes bar-in {
        0%, 15%  { opacity: 0.15; transform: scaleX(0.4); }
        40%, 80% { opacity: 1;    transform: scaleX(1); }
        95%,100% { opacity: 0.15; transform: scaleX(0.4); }
      }
      @keyframes cube-blink {
        0%, 65%, 100% { opacity: 1;   transform: scale(1); }
        75%           { opacity: 0.3; transform: scale(0.7); }
        88%           { opacity: 1;   transform: scale(1.2); }
      }
      @keyframes dot-breathe {
        0%, 100% { transform: scale(1);   opacity: 1; }
        40%      { transform: scale(1.6); opacity: 0.5; }
        60%      { transform: scale(0.7); opacity: 0.9; }
      }
    </style>
  </defs>
  <g class="sparkle-body">
    <path d="M 0,-80 C 28,-31 28,-31 80,0 C 28,31 28,31 0,80 C -28,31 -28,31 -80,0 C -28,-31 -28,-31 0,-80 Z" fill="#4945FF"/>
    <g clip-path="url(#ck-anim)">
      <rect class="bar1" x="-33" y="-25" width="66" height="17" rx="5" fill="white" opacity="0.96"/>
      <rect class="bar2" x="-24" y="-2"  width="48" height="17" rx="5" fill="white" opacity="0.96"/>
      <rect class="bar3" x="-16" y="21"  width="32" height="17" rx="5" fill="white" opacity="0.96"/>
    </g>
  </g>
  <g class="cube">
    <rect x="62" y="-98" width="34" height="30" rx="7" fill="#F5CF0D"/>
    <rect x="66" y="-94" width="14" height="10" rx="3" fill="white" opacity="0.5"/>
  </g>
  <circle class="dot" cx="-72" cy="66" r="11" fill="#9736E8"/>
</svg>
